# Global mise config. mise handles per-project tools (a project's mise.toml); nvm and pyenv
# still manage Node and Python, so there are no node or python entries here.
[tools]

[settings]
# Don't read .nvmrc, .node-version or .python-version ("idiomatic version files"), so those
# keep going through nvm and pyenv. This is mise's default; set explicitly so it can't drift.
# https://mise.jdx.dev/configuration/settings.html#idiomatic_version_file_enable_tools
idiomatic_version_file_enable_tools = []
# Keep mise's shims off PATH, so a project's tools are only on PATH inside that project
# (mise activate otherwise adds the shims directory everywhere).
# https://mise.jdx.dev/configuration/settings.html#activate_shims
activate_shims = false
